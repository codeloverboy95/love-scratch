<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seductive Secrets - Pure Passion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            touch-action: none;
            background: radial-gradient(circle at center, #2e021a 0%, #0d0007 100%);
            color: #ffe4e6;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        @keyframes eroticGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(225, 29, 72, 0.4), inset 0 0 15px rgba(244, 63, 94, 0.2); }
            50% { box-shadow: 0 0 45px rgba(244, 63, 94, 0.7), inset 0 0 25px rgba(225, 29, 72, 0.4); }
        }

        .erotic-frame {
            background: rgba(255, 20, 147, 0.05);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(244, 63, 94, 0.4);
            animation: eroticGlow 3s infinite ease-in-out;
        }

        .glow-title {
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.9), 0 0 30px rgba(225, 29, 72, 0.7);
        }

        .scale-up {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }
        .scale-down {
            transform: translateX(-50%) scale(0);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 md:p-4">

    <!-- Header Section -->
    <header class="w-full max-w-4xl text-center py-1">
        <h1 class="text-xl md:text-3xl font-extrabold tracking-wider text-rose-400 glow-title flex items-center justify-center gap-2">
            <span>💋</span> Seductive Secrets <span>💋</span>
        </h1>
        <p class="text-xs md:text-sm text-rose-200/90 italic mt-0.5 min-h-[22px] flex items-center justify-center px-4 font-medium" id="quote-text">
            "Touch gently... let the warmth melt away the secrecy."
        </p>
    </header>

    <!-- Main Game Area -->
    <main class="w-full flex-1 flex flex-col items-center justify-center relative my-1">
        <div class="relative w-[94vw] h-[94vw] sm:w-[72vw] sm:h-[72vw] max-w-[620px] max-h-[620px] erotic-frame rounded-2xl p-1.5 flex items-center justify-center shadow-2xl overflow-hidden">
            
            <div class="relative w-full h-full rounded-xl overflow-hidden bg-black shadow-inner">
                <!-- Secret Image Layer -->
                <canvas id="imageCanvas" class="absolute inset-0 w-full h-full object-cover"></canvas>
                <!-- Scratchable Top Cover Layer -->
                <canvas id="scratchCanvas" class="absolute inset-0 w-full h-full object-cover cursor-crosshair"></canvas>
                <!-- Interactive Particles -->
                <canvas id="particleCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
            </div>

            <!-- Bottom Center Compact Next Desire Button -->
            <div id="win-modal" class="scale-down absolute bottom-4 left-1/2 z-30 transition-all duration-300">
                <button onclick="nextLevel()" class="px-6 py-3 bg-gradient-to-r from-rose-600 via-pink-600 to-red-600 text-white font-extrabold rounded-xl shadow-2xl hover:scale-105 active:scale-95 transition-all text-sm md:text-base border border-rose-300/60 glow-title whitespace-nowrap">
                    Next Desire 💋
                </button>
            </div>

        </div>
    </main>

    <!-- Controls & Level Switcher -->
    <footer class="w-full max-w-2xl flex flex-col gap-2 py-1">
        <div class="flex justify-center items-center gap-2">
            <button onclick="selectLevel(0)" class="px-4 py-1.5 font-bold rounded-full bg-rose-950/80 border border-rose-500/50 text-rose-200 active:scale-95 hover:bg-rose-900 transition text-xs">Desire I</button>
            <button onclick="selectLevel(1)" class="px-4 py-1.5 font-bold rounded-full bg-rose-950/80 border border-rose-500/50 text-rose-200 active:scale-95 hover:bg-rose-900 transition text-xs">Desire II</button>
            <button onclick="selectLevel(2)" class="px-4 py-1.5 font-bold rounded-full bg-rose-950/80 border border-rose-500/50 text-rose-200 active:scale-95 hover:bg-rose-900 transition text-xs">Desire III</button>
        </div>

        <div class="flex items-center justify-between px-3 text-xs text-rose-300 font-medium">
            <span class="bg-rose-950/70 px-3 py-1 rounded-lg border border-rose-500/40">Exposed: <strong id="progress-text" class="text-rose-400 font-bold">0%</strong></span>
            <div class="flex gap-2">
                <button onclick="resetScratch()" class="px-3 py-1.5 bg-rose-950/70 border border-rose-500/40 rounded-lg hover:bg-rose-900 active:scale-95 transition text-xs">Cover Again 🔄</button>
                <button onclick="autoReveal()" class="px-3.5 py-1.5 bg-gradient-to-r from-rose-600 to-pink-600 rounded-lg text-white font-bold shadow hover:opacity-95 active:scale-95 transition text-xs">Instant Reveal ✨</button>
            </div>
        </div>
    </footer>

    <!-- Game Engine Script -->
    <script>
        const imageCanvas = document.getElementById('imageCanvas');
        const scratchCanvas = document.getElementById('scratchCanvas');
        const particleCanvas = document.getElementById('particleCanvas');
        const iCtx = imageCanvas.getContext('2d');
        const sCtx = scratchCanvas.getContext('2d');
        const pCtx = particleCanvas.getContext('2d');
        const progressEl = document.getElementById('progress-text');
        const winModal = document.getElementById('win-modal');
        const quoteEl = document.getElementById('quote-text');

        let currentLevel = 0;
        let isDrawing = false;
        let isWon = false;
        let currentPercentage = 0;
        let sparkParticles = [];

        const levels = [
            { src: 'images/puzzle1.jpg', quote: '"Touch gently... let the warmth melt away the secrecy."' },
            { src: 'images/puzzle2.jpg', quote: '"Feel the friction as raw passion fades into view..."' },
            { src: 'images/puzzle3.jpg', quote: '"Slow and deep... uncover every hidden fantasy."' }
        ];

        const img = new Image();

        function initGame() {
            imageCanvas.width = 800;
            imageCanvas.height = 800;
            scratchCanvas.width = 800;
            scratchCanvas.height = 800;
            particleCanvas.width = 800;
            particleCanvas.height = 800;
            loadLevel(currentLevel);
            requestAnimationFrame(animateParticles);
        }

        function loadLevel(index) {
            currentLevel = index;
            isWon = false;
            currentPercentage = 0;
            winModal.classList.remove('scale-up');
            winModal.classList.add('scale-down');
            quoteEl.innerText = levels[currentLevel].quote;
            progressEl.innerText = '0%';

            img.crossOrigin = "anonymous";
            img.src = levels[currentLevel].src;
            img.onload = () => drawImageAndCover();
            img.onerror = () => createFallback();
        }

        function createFallback() {
            const temp = document.createElement('canvas');
            temp.width = 800;
            temp.height = 800;
            const tCtx = temp.getContext('2d');
            const grad = tCtx.createRadialGradient(400, 400, 50, 400, 400, 500);
            grad.addColorStop(0, '#f43f5e');
            grad.addColorStop(0.5, '#881337');
            grad.addColorStop(1, '#1c020f');
            tCtx.fillStyle = grad;
            tCtx.fillRect(0, 0, 800, 800);

            tCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            tCtx.beginPath();
            tCtx.arc(280, 300, 150, Math.PI, 0, false);
            tCtx.arc(520, 300, 150, Math.PI, 0, false);
            tCtx.lineTo(400, 650);
            tCtx.closePath();
            tCtx.fill();

            tCtx.fillStyle = '#fff0f5';
            tCtx.font = 'bold 42px sans-serif';
            tCtx.textAlign = 'center';
            tCtx.fillText(`SECRET DESIRE #${currentLevel + 1}`, 400, 420);

            img.src = temp.toDataURL();
        }

        function drawImageAndCover() {
            iCtx.clearRect(0, 0, 800, 800);
            iCtx.drawImage(img, 0, 0, 800, 800);

            sCtx.globalCompositeOperation = 'source-over';
            const coverGrad = sCtx.createLinearGradient(0, 0, 800, 800);
            coverGrad.addColorStop(0, '#58081f');
            coverGrad.addColorStop(0.5, '#9f1239');
            coverGrad.addColorStop(1, '#28010b');
            sCtx.fillStyle = coverGrad;
            sCtx.fillRect(0, 0, 800, 800);

            sCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            sCtx.font = 'bold 34px sans-serif';
            sCtx.textAlign = 'center';
            sCtx.fillText('💋 SCRATCH TO UNCOVER DESIRE 💋', 400, 400);
        }

        function scratch(e) {
            if (isWon) return;
            const rect = scratchCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = (clientX - rect.left) * (scratchCanvas.width / rect.width);
            const y = (clientY - rect.top) * (scratchCanvas.height / rect.height);

            sCtx.globalCompositeOperation = 'destination-out';
            sCtx.beginPath();
            sCtx.arc(x, y, 65, 0, Math.PI * 2);
            sCtx.fill();

            for (let i = 0; i < 4; i++) {
                sparkParticles.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y + (Math.random() - 0.5) * 30,
                    size: Math.random() * 10 + 6,
                    speedX: (Math.random() - 0.5) * 4,
                    speedY: (Math.random() - 0.5) * 4,
                    opacity: 1
                });
            }

            calculateProgress();
        }

        function animateParticles() {
            pCtx.clearRect(0, 0, 800, 800);
            sparkParticles.forEach((p, index) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.opacity -= 0.035;
                if (p.opacity <= 0) {
                    sparkParticles.splice(index, 1);
                    return;
                }
                pCtx.save();
                pCtx.globalAlpha = p.opacity;
                pCtx.fillStyle = '#fb7185';
                
                pCtx.beginPath();
                const topCurveHeight = p.size * 0.3;
                pCtx.moveTo(p.x, p.y + topCurveHeight);
                pCtx.bezierCurveTo(p.x, p.y, p.x - p.size / 2, p.y, p.x - p.size / 2, p.y + topCurveHeight);
                pCtx.bezierCurveTo(p.x - p.size / 2, p.y + (p.size + topCurveHeight) / 2, p.x, p.y + p.size, p.x, p.y + p.size);
                pCtx.bezierCurveTo(p.x, p.y + p.size, p.x + p.size / 2, p.y + (p.size + topCurveHeight) / 2, p.x + p.size / 2, p.y + topCurveHeight);
                pCtx.bezierCurveTo(p.x + p.size / 2, p.y, p.x, p.y, p.x, p.y + topCurveHeight);
                pCtx.closePath();
                pCtx.fill();

                pCtx.restore();
            });
            requestAnimationFrame(animateParticles);
        }

        function calculateProgress() {
            const imageData = sCtx.getImageData(0, 0, 800, 800);
            const pixels = imageData.data;
            let transparent = 0;
            for (let i = 3; i < pixels.length; i += 64) {
                if (pixels[i] < 128) transparent++;
            }
            const totalSampled = pixels.length / 64;
            currentPercentage = Math.round((transparent / totalSampled) * 100);
            progressEl.innerText = currentPercentage + '%';

            if (currentPercentage > 20 && currentPercentage < 50) {
                quoteEl.innerText = '"Getting warmer... don\'t stop now..."';
            } else if (currentPercentage >= 50 && currentPercentage < 70) {
                quoteEl.innerText = '"So tempting... almost there..."';
            }
        }

        function handleRelease() {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentPercentage >= 70 && !isWon) {
                isWon = true;
                sCtx.clearRect(0, 0, 800, 800);
                progressEl.innerText = '100%';
                quoteEl.innerText = '"Uncovered and completely yours..."';
                winModal.classList.remove('scale-down');
                winModal.classList.add('scale-up');
            }
        }

        scratchCanvas.addEventListener('mousedown', () => isDrawing = true);
        scratchCanvas.addEventListener('mousemove', (e) => { if (isDrawing) scratch(e); });
        window.addEventListener('mouseup', handleRelease);

        scratchCanvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        scratchCanvas.addEventListener('touchmove', (e) => { if (isDrawing) scratch(e); });
        window.addEventListener('touchend', handleRelease);

        function resetScratch() {
            drawImageAndCover();
            isWon = false;
            currentPercentage = 0;
            winModal.classList.remove('scale-up');
            winModal.classList.add('scale-down');
            progressEl.innerText = '0%';
            quoteEl.innerText = levels[currentLevel].quote;
        }

        function autoReveal() {
            sCtx.clearRect(0, 0, 800, 800);
            progressEl.innerText = '100%';
            currentPercentage = 100;
            isWon = true;
            quoteEl.innerText = '"Uncovered and completely yours..."';
            winModal.classList.remove('scale-down');
            winModal.classList.add('scale-up');
        }

        function selectLevel(idx) {
            loadLevel(idx);
        }

        function nextLevel() {
            currentLevel = (currentLevel + 1) % levels.length;
            loadLevel(currentLevel);
        }

        window.onload = initGame;
    </script>
</body>
</html>
